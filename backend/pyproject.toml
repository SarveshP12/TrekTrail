[project]
name = "trektrack-backend"
version = "0.1.0"
requires-python = ">=3.11"

# -------------------------------
# BLACK (Code Formatter)
# -------------------------------
[tool.black]
line-length = 100
target-version = ["py311"]

# -------------------------------
# RUFF (Linter + Import checks)
# -------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]  # Errors, Flake, Imports
fixable = ["ALL"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Alembic needs these imports for metadata detection
"alembic/env.py" = ["F401"]
"alembic/versions/*.py" = ["F401"]

# -------------------------------
# PYTEST (Testing)
# -------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]